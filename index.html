<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세미나 기획 데스크 | NE능률 디지털마케팅팀</title>
<meta name="description" content="NE능률 디지털마케팅팀 세미나 요청 접수 및 진행현황 조회">
<meta name="theme-color" content="#0E2C55">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="세미나 기획 데스크">
<meta property="og:description" content="세미나 요청 접수 및 진행현황 조회">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E2C55'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'%3EN%3C/text%3E%3C/svg%3E">
<style>
  :root{
    /* 보고서 톤앤매너 — 잉크 네이비 기반, 절제된 강조색 */
    --navy:#0E2C55; --navy-deep:#081E3C; --navy-mid:#2C5A93;
    --navy-soft:#E6EEF7; --navy-line:#C7D6E8;
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F6F8FA;
    --ink:#1E2733; --ink-soft:#4A5563; --muted:#7C8695; --muted-soft:#EFF2F5;
    --line:#DDE2E8; --line-strong:#C8D0DA;
    --gold:#9A5B00; --gold-soft:#FCF1DE; --gold-line:#E3C08A;
    --green:#186043; --green-soft:#E6F1EB; --green-line:#A6CCB7;
    --blue:#2C5A93; --blue-soft:#E9F0F8;
    --red:#96201A; --red-soft:#FBEAE8; --red-line:#E0B3AE;
    --radius:6px;
    --shadow:0 1px 2px rgba(14,44,85,.05), 0 6px 18px rgba(14,44,85,.05);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{-webkit-font-smoothing:antialiased;letter-spacing:-.005em;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.01em;}

  #app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--surface);
       display:flex;flex-direction:column;transition:max-width .15s ease;
       box-shadow:0 0 0 1px var(--line);}
  #app.wide-view{max-width:1280px;}
  @media (max-width:1340px){ #app.wide-view{max-width:100%;} }

  /* ---------- Header ---------- */
  header.top{
    position:sticky;top:0;z-index:20;background:var(--surface);
    border-bottom:2.5px solid var(--navy);padding:20px 26px 0 26px;
  }
  .brand-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
             margin-bottom:16px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:3px;}
  .brand .mark{font-size:11px;letter-spacing:.14em;color:var(--navy-mid);font-weight:700;}
  .brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--navy);}
  .new-btn{
    background:var(--navy);color:#fff;border:none;border-radius:var(--radius);
    padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
    white-space:nowrap;letter-spacing:-.01em;
  }
  .new-btn:hover{background:var(--navy-deep);}
  .tabs{display:flex;gap:22px;}
  .tab-btn{
    background:none;border:none;color:var(--muted);font-family:inherit;
    font-size:14px;font-weight:700;padding:0 2px 11px 2px;cursor:pointer;
    border-bottom:2.5px solid transparent;margin-bottom:-2.5px;letter-spacing:-.01em;
  }
  .tab-btn:hover{color:var(--ink-soft);}
  .tab-btn.active{color:var(--navy);border-bottom-color:var(--navy);}

  .back-row{display:flex;align-items:center;gap:12px;padding-bottom:16px;}
  .back-link{background:none;border:none;color:var(--navy-mid);font-size:13px;cursor:pointer;
             padding:0;font-weight:700;font-family:inherit;}
  .back-link:hover{color:var(--navy);text-decoration:underline;}
  .page-title{font-size:16px;font-weight:800;color:var(--navy);letter-spacing:-.02em;}

  main{flex:1;padding:20px 26px 110px 26px;}

  /* ---------- Notice strip ---------- */
  .notice{
    display:flex;align-items:flex-start;gap:8px;
    background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--navy-mid);
    border-radius:0 var(--radius) var(--radius) 0;
    padding:9px 13px;font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:10px;
  }
  .notice b{color:var(--ink);font-weight:700;}
  .notice.warn{border-left-color:var(--gold);background:var(--gold-soft);border-color:var(--gold-line);color:#6E4300;}
  .notice.err{border-left-color:var(--red);background:var(--red-soft);border-color:var(--red-line);color:#7A1B16;}
  .notice .n-act{margin-left:auto;flex:none;}
  .notice button{
    background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;
    padding:5px 11px;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit;
  }
  .conn{font-size:11.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--muted);}
  .conn .led{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none;}
  .conn.live{color:var(--green);} .conn.live .led{background:var(--green);}
  .conn.local{color:var(--gold);} .conn.local .led{background:var(--gold);}

  /* ---------- Search / filter ---------- */
  .search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .search-bar input{
    flex:1;min-width:200px;border:1px solid var(--line-strong);border-radius:var(--radius);
    padding:9px 12px;font-size:13.5px;font-family:inherit;color:var(--ink);background:var(--surface);
  }
  .search-bar input:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:var(--navy);}
  .filter-pills{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .pill{
    border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);
    padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;
    font-family:inherit;white-space:nowrap;
  }
  .pill:hover{border-color:var(--navy-mid);color:var(--navy);}
  .pill.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .toolbar{margin-bottom:12px;}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;}
  select.ctrl{
    border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);
    padding:8px 11px;font-size:12.5px;font-family:inherit;font-weight:700;color:var(--ink-soft);
    cursor:pointer;max-width:200px;
  }
  select.ctrl:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:var(--navy);}
  select.ctrl.on{border-color:var(--navy);color:var(--navy);background:var(--navy-soft);}
  .pill.ghost{border-style:dashed;color:var(--muted);}
  .pill.ghost:hover{border-style:solid;}
  .refresh-btn{
    display:inline-flex;align-items:center;gap:6px;margin-left:auto;
    border:1px solid var(--navy);background:var(--surface);border-radius:var(--radius);
    padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit;
    white-space:nowrap;
  }
  .refresh-btn:hover{background:var(--navy);color:#fff;}
  .refresh-btn:disabled{opacity:.55;cursor:progress;background:var(--surface);color:var(--navy);}
  .refresh-btn .ico{
    width:11px;height:11px;border:2px solid currentColor;border-top-color:transparent;
    border-radius:50%;display:inline-block;
  }
  .refresh-btn.spin .ico{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .result-line{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 8px 0;
  }
  .result-line b{color:var(--navy);font-weight:800;}
  .result-line .stamp{color:var(--muted);font-weight:600;}
  mark{background:var(--gold-soft);color:#6E4300;font-weight:800;padding:0 1px;border-radius:2px;}

  /* ---------- Table ---------- */
  .archive-table-wrap{
    border:1px solid var(--line);border-radius:var(--radius);overflow:auto;background:var(--surface);
    max-height:calc(100vh - 300px);
  }
  table.archive-table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;line-height:1.45;}
  table.archive-table thead th{
    position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;font-weight:600;
    padding:9px 12px;white-space:nowrap;z-index:2;font-size:12px;letter-spacing:-.01em;
    border-right:1px solid rgba(255,255,255,.14);
  }
  table.archive-table thead th:last-child{border-right:none;}
  table.archive-table thead th.sortable{cursor:pointer;user-select:none;}
  table.archive-table thead th.sortable:hover{background:var(--navy-deep);}
  .sort-arrow{opacity:.7;font-size:10px;margin-left:2px;}
  table.archive-table td{
    padding:8px 12px;border-bottom:1px solid var(--line);color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top;
  }
  table.archive-table tbody tr:last-child td{border-bottom:none;}
  table.archive-table td.cell-wide{white-space:normal;}
  table.archive-table th.col-date, table.archive-table td.col-date{white-space:nowrap;width:104px;}
  table.archive-table th.col-kind, table.archive-table td.col-kind{width:112px;}
  table.archive-table th.col-qtr, table.archive-table td.col-qtr{width:142px;white-space:nowrap;}
  table.archive-table th.col-product, table.archive-table td.col-product{min-width:230px;max-width:330px;white-space:normal;}
  table.archive-table th.col-title, table.archive-table td.col-title{min-width:300px;max-width:440px;}
  table.archive-table th.col-reason, table.archive-table td.col-reason{min-width:180px;max-width:250px;white-space:normal;}
  table.archive-table td.cell-link{color:var(--blue);max-width:70px;font-weight:700;}
  table.archive-table td.cell-sub, .cell-sub{color:var(--muted);font-size:11px;}
  table.archive-table tbody tr:nth-child(even){background:#FAFBFC;}
  table.archive-table tbody tr:hover{background:var(--navy-soft);cursor:pointer;}
  table.archive-table tbody tr.row-highlight{background:var(--gold-soft)!important;box-shadow:inset 3px 0 0 var(--gold);}
  tr.table-group-row td{
    font-size:12px;font-weight:800;color:var(--navy);background:var(--navy-soft);
    padding:7px 12px;border-bottom:1px solid var(--navy-line);letter-spacing:-.01em;
  }
  .kind-chip{
    display:inline-block;background:var(--muted-soft);color:var(--ink-soft);border:1px solid var(--line);
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;white-space:nowrap;
  }
  .type-tag{
    display:inline-block;background:var(--navy-soft);color:var(--navy);border:1px solid var(--navy-line);
    font-size:10px;font-weight:800;padding:1px 6px;border-radius:3px;margin-right:5px;vertical-align:1px;
  }
  .new-flag-inline{
    display:inline-block;background:var(--gold);color:#fff;font-size:9.5px;font-weight:800;
    padding:1px 6px;border-radius:3px;vertical-align:1px;margin-left:4px;letter-spacing:.04em;
  }
  .badge{
    display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:3px;
    white-space:nowrap;border:1px solid transparent;
  }
  .badge.gray{background:var(--muted-soft);color:var(--ink-soft);border-color:var(--line);}
  .badge.blue{background:var(--blue-soft);color:var(--blue);border-color:var(--navy-line);}
  .badge.green{background:var(--green-soft);color:var(--green);border-color:var(--green-line);}
  .badge.amber{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-line);}
  .badge.navy{background:var(--navy);color:#fff;border-color:var(--navy);}

  .empty{text-align:center;padding:56px 20px;color:var(--muted);font-size:13.5px;line-height:1.7;}
  .empty .big{font-size:13px;font-weight:800;color:var(--ink-soft);margin-bottom:8px;letter-spacing:.06em;}

  /* ---------- Detail sheet ---------- */
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(14,30,50,.46);z-index:40;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--surface);width:100%;max-width:760px;border-radius:10px 10px 0 0;
    padding:24px 26px 30px 26px;max-height:88vh;overflow-y:auto;
    box-shadow:0 -8px 40px rgba(0,0,0,.22);
  }
  .sheet-handle{width:38px;height:4px;background:var(--line-strong);border-radius:4px;margin:0 auto 16px auto;}
  .sheet h2{font-size:17.5px;margin:0 0 5px 0;font-weight:800;letter-spacing:-.02em;color:var(--navy);line-height:1.4;}
  .sheet .sheet-code{font-size:12px;color:var(--muted);margin-bottom:18px;font-weight:700;}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:9px 14px;font-size:13.5px;margin-bottom:7px;}
  .kv .k{color:var(--ink-soft);font-weight:700;}
  .kv .v{color:var(--ink);}
  .sheet-section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .sheet-close{
    position:absolute;top:16px;right:18px;background:var(--muted-soft);border:1px solid var(--line);
    width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--ink-soft);font-family:inherit;
  }
  .sheet-close:hover{background:var(--line);}
  .sheet-wrap{position:relative;}
  .reason-box{
    background:var(--gold-soft);border:1px solid var(--gold-line);color:#6E4300;
    border-radius:var(--radius);padding:11px 13px;font-size:13px;margin-top:14px;line-height:1.6;
  }
  .link-box{
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 13px;font-size:13px;color:var(--ink-soft);white-space:pre-wrap;line-height:1.6;word-break:break-all;
  }

  /* ---------- Stepper ---------- */
  .stepper{display:flex;margin:4px 0 2px 0;}
  .step{flex:1;position:relative;text-align:center;padding-top:16px;}
  .step .line{position:absolute;top:5px;left:0;width:100%;height:2px;background:var(--line);}
  .step:first-child .line{left:50%;width:50%;}
  .step:last-child .line{width:50%;}
  .step .dot{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:12px;height:12px;border-radius:50%;background:var(--surface);
    border:2px solid var(--line-strong);
  }
  .step .lbl{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:-.01em;}
  .step.done .line{background:var(--navy-mid);}
  .step.done .dot{background:var(--navy);border-color:var(--navy);}
  .step.done .lbl{color:var(--navy);}
  .step.active-green .line{background:var(--green);}
  .step.active-green .dot{background:var(--green);border-color:var(--green);}
  .step.active-green .lbl{color:var(--green);}
  .step.active-amber .line{background:var(--gold);}
  .step.active-amber .dot{background:var(--gold);border-color:var(--gold);}
  .step.active-amber .lbl{color:var(--gold);}
  .step.muted-end .lbl{color:var(--muted);}

  /* ---------- Form ---------- */
  .section-label{
    font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);
    margin:26px 0 12px 0;padding-bottom:7px;border-bottom:1px solid var(--line);
  }
  .field{margin-bottom:22px;}
  .field label{display:flex;align-items:center;font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:9px;letter-spacing:-.01em;}
  .field-num{
    display:inline-flex;align-items:center;justify-content:center;
    width:19px;height:19px;border-radius:3px;background:var(--navy);color:#fff;
    font-size:11px;font-weight:700;margin-right:9px;flex-shrink:0;
  }
  .sub-caption{font-size:12px;font-weight:700;color:var(--ink-soft);margin:11px 0 6px 1px;}
  .field label .req{color:var(--red);margin-left:3px;}
  .field label .opt{color:var(--muted);font-weight:600;margin-left:6px;font-size:12px;}
  .field .help{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.65;white-space:pre-line;}
  .field .help b{color:var(--ink-soft);font-weight:700;}
  .btn-group{display:flex;flex-wrap:wrap;gap:7px;}
  .choice-btn{
    padding:10px 15px;border-radius:var(--radius);border:1px solid var(--line-strong);background:var(--surface);
    font-size:13.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;letter-spacing:-.01em;
  }
  .choice-btn:hover{border-color:var(--navy-mid);color:var(--navy);}
  .choice-btn.selected{background:var(--navy);border-color:var(--navy);color:#fff;}
  .choice-btn.kind-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;min-width:152px;padding:9px 15px;}
  .kind-btn-title{font-size:13.5px;font-weight:800;}
  .kind-btn-desc{font-size:10.5px;font-weight:600;color:var(--muted);}
  .choice-btn.kind-btn.selected .kind-btn-desc{color:rgba(255,255,255,.78);}
  .choice-btn.add-btn{border-style:dashed;color:var(--navy);}
  .choice-btn.add-btn.selected{border-style:solid;color:#fff;}
  input[type=text], input[type=email], textarea{
    width:100%;border:1px solid var(--line-strong);border-radius:var(--radius);padding:11px 12px;
    font-size:14px;font-family:inherit;color:var(--ink);background:var(--surface);
  }
  input:focus, textarea:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:var(--navy);}
  textarea{resize:vertical;min-height:84px;line-height:1.6;}
  .submit-bar{position:sticky;bottom:0;background:linear-gradient(to top,var(--surface) 72%,rgba(255,255,255,0));padding:16px 0 6px 0;margin-top:10px;}
  .submit-btn{
    width:100%;background:var(--navy);color:#fff;border:none;border-radius:var(--radius);
    padding:15px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:-.01em;
    box-shadow:0 4px 14px rgba(14,44,85,.22);
  }
  .submit-btn:hover{background:var(--navy-deep);}
  .submit-btn:disabled{background:var(--muted);box-shadow:none;cursor:not-allowed;}

  /* ---------- Form: 안내 / 진행률 / 검증 ---------- */
  .guide{
    background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--navy);
    border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;margin-bottom:18px;
  }
  .guide h3{margin:0 0 11px 0;font-size:14px;font-weight:800;color:var(--navy);letter-spacing:-.02em;}
  .guide ul{margin:0;padding-left:0;list-style:none;}
  .guide li{font-size:13px;color:var(--ink-soft);line-height:1.7;padding-left:15px;position:relative;margin-bottom:3px;}
  .guide li::before{content:"";position:absolute;left:3px;top:10px;width:4px;height:4px;border-radius:50%;background:var(--muted);}
  .guide li b{color:var(--ink);font-weight:700;}
  .guide-note{
    margin-top:13px;padding:10px 13px;border-radius:var(--radius);
    background:var(--gold-soft);border:1px solid var(--gold-line);color:#6E4300;
    font-size:12.5px;line-height:1.65;
  }
  .disclose{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;}
  .disclose-btn{
    background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
    font-size:12.5px;font-weight:700;color:var(--blue);
  }
  .disclose-btn:hover{color:var(--navy);text-decoration:underline;}
  .disclose-body{
    margin-top:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.75;white-space:pre-line;
  }
  .disclose-body .good{color:var(--green);font-weight:800;}
  .disclose-body .bad{color:var(--red);font-weight:800;}
  .disclose-body b{color:var(--ink);font-weight:700;}

  .progress-wrap{
    position:sticky;top:var(--hdr-h,0px);z-index:5;background:var(--surface);
    padding:11px 0 12px 0;margin:-4px 0 16px 0;
    box-shadow:0 8px 8px -8px rgba(14,44,85,.10);
  }
  .progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  .progress-head .lbl{font-size:12px;font-weight:800;color:var(--ink-soft);letter-spacing:-.01em;}
  .progress-head .cnt{font-size:12px;font-weight:800;color:var(--navy);}
  .progress-head .cnt.done{color:var(--green);}
  .progress-bar{height:5px;border-radius:3px;background:var(--muted-soft);overflow:hidden;}

  tab: "progress",       // progress | archive

  refreshing: false,
  lastLoaded: null,
  searchField: 'all',      // all | id | owner | dept | product | kind | target | text
  filterStatus: 'all',
  filterQtr: 'all',
  deptOptions: DEPTS_DEFAULT.slice(),
  formData: emptyForm(),
  formErrors: {},
  openHelp: {},
  draftRestored: false,
  lastSubmittedId: "",

};

function emptyForm(){
  return {qtrYear:"", qtrQuarter:"", qtr:"", deptChoice:"", deptCustom:"", dept:"", owner:"",
          productType:"", productName:"", productDetail:"", kind:"", targetSelected:[],
          background:"", effect:"", ref:"", email:""};
}

/* 작성 중 내용 임시 저장 (브라우저에만 저장, 제출하면 자동 삭제) */
const DRAFT_KEY = 'seminar-need-draft-v1';
const draft = {
  save(o){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(o)); }catch(e){} },
  load(){ try{ const v = localStorage.getItem(DRAFT_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  clear(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
};
function hasContent(f){
  if(!f) return false;
  return !!(f.qtr || f.deptChoice || f.owner || f.productType || f.productName ||
            f.productDetail || f.kind || (f.targetSelected && f.targetSelected.length) ||
            f.background || f.effect || f.ref || f.email);
}

/* =========================================================
   구글시트 연동 설정
   Apps Script 배포 후 나오는 웹앱 URL을 아래에 붙여넣으면
   실제 구글시트와 연동되어 동작합니다. 비워두면 브라우저 로컬 저장(테스트용)으로 동작합니다.
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbyfYLjVZnaHJld8TjSukzirSI5J9rKWuG2FuzV3jMqI_2WOmYKmgdMQXJevBNsSVSFT/exec"; // 예: "https://script.google.com/macros/s/AKfycb.../exec"

/* 브라우저 저장소 안전 래퍼 (구글시트 미연동 시에만 사용) */
const localStore = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

async function loadStoredNeeds(isRefresh){
  if(API_URL){
    if(!isRefresh){
      state.connection = 'loading';
      render();
    }
    try{
      const res = await fetch(API_URL, {method:'GET'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      let data;
      try{
        data = JSON.parse(text);
      }catch(parseErr){
        // JSON이 아니라 HTML(구글 로그인 페이지)이 돌아온 경우
        throw new Error('AUTH');
      }
      if(!data.ok) throw new Error(data.error || '시트에서 오류를 반환했습니다.');
      state.needs = Array.isArray(data.needs) ? data.needs : [];
      if(Array.isArray(data.depts) && data.depts.length){
        state.deptOptions = data.depts;
      }
      state.connection = 'live';
      state.loadError = '';
      state.lastLoaded = new Date();
      render();
      return;
    }catch(e){
      // 연동 실패 시 목업 데이터를 실데이터처럼 보여주지 않고 오류 상태로 명확히 표시
      console.error('구글시트 연동 실패:', e);
      state.needs = [];
      state.connection = 'error';
      state.loadError = (e && e.message) ? e.message : '알 수 없는 오류';
      render();
      return;
    }
  }
  // 구글시트 미연동(로컬 데모) 모드
  state.connection = 'local';
  state.lastLoaded = new Date();
  try{
    const raw = localStore.get('needs-submissions');
    state.needs = raw ? seedNeeds.concat(JSON.parse(raw)) : seedNeeds.slice();
  }catch(e){
    state.needs = seedNeeds.slice();
  }
  render();
}

function retryLoad(){ loadStoredNeeds(); }

/* 구글시트 데이터를 원하는 시점에 다시 불러오기 (검색·필터 조건은 유지) */
async function refreshNeeds(){
  if(state.refreshing) return;
  state.refreshing = true;
  const btn = document.getElementById('refreshBtn');
  if(btn){ btn.disabled = true; btn.classList.add('spin'); btn.querySelector('.txt').textContent = '불러오는 중'; }
  try{
    await loadStoredNeeds(true);
  } finally {
    state.refreshing = false;
    renderOnly();
  }
}

function stampText(){
  if(!state.lastLoaded) return '';
  const d = state.lastLoaded;
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} 기준`;
}

async function persistNeeds(){
  const custom = state.needs.filter(n => !seedNeeds.find(sd => sd.id === n.id));
  localStore.set('needs-submissions', JSON.stringify(custom));
}

/* =========================================================
   NAV HELPERS
   ========================================================= */
function goToForm(){
  state.view = "form";
  state.formErrors = {};
  state.openHelp = {};
  const saved = draft.load();
  if(hasContent(saved)){
    state.formData = Object.assign(emptyForm(), saved);
    state.draftRestored = true;
  }else{
    state.formData = emptyForm();
    state.draftRestored = false;
  }
  render();
  window.scrollTo(0,0);
}
function startFresh(){
  draft.clear();
  state.formData = emptyForm();
  state.formErrors = {};
  state.draftRestored = false;
  render();
  window.scrollTo(0,0);
}
function toggleHelp(key){
  state.openHelp[key] = !state.openHelp[key];
  render();
}
function goToBrowse(){
  state.view = "browse";
  render();
}
function switchTab(tab){
  state.tab = tab;
  render();
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===tab);
  });
}
function switchArchiveFilter(f){
  state.archiveFilter = f;
  render();
}
function toggleSubmittedSort(){
  state.sortMode = (state.sortMode === 'submitted_desc') ? 'submitted_asc' : 'submitted_desc';
  renderOnly();
}
function toggleQtrGrouping(){
  state.sortMode = (state.sortMode === 'qtr') ? 'submitted_desc' : 'qtr';
  renderOnly();
}
function sortNeeds(list){
  const sorted = list.slice();
  const sub = n => str(n.submitted);
  if(state.sortMode === "submitted_desc"){
    sorted.sort((a,b) => sub(b).localeCompare(sub(a)));
  } else if(state.sortMode === "submitted_asc"){
    sorted.sort((a,b) => sub(a).localeCompare(sub(b)));
  } else if(state.sortMode === "qtr"){
    sorted.sort((a,b) => {
      let qa = QUARTERS_ALL.indexOf(str(a.qtr)), qb = QUARTERS_ALL.indexOf(str(b.qtr));
      if(qa === -1) qa = 999; if(qb === -1) qb = 999;
      if(qa !== qb) return qa - qb;
      return sub(a).localeCompare(sub(b));
    });
  }
  return sorted;
}

/* =========================================================
   STEPPER LOGIC (signature element)
   ========================================================= */
function stepConfig(status){
  const base = [
    {label:"접수완료", key:"접수완료"},
    {label:"검토중", key:"검토중"},
  ];
  if(status === "차기 검토"){
    base.push({label:"차기 검토", key:"차기 검토", cls:"active-amber"});
    base.push({label:"종료(재검토)", key:"__end__", cls:"muted-end"});
  } else {
    base.push({label:"수락(채택)", key:"수락(채택)", cls:"active-green"});
    base.push({label:"완료", key:"완료", cls:"done-final"});
  }
  return base;
}
function renderStepper(status){
  const steps = stepConfig(status);
  const order = steps.map(s=>s.key);
  let curIdx = order.indexOf(status);
  if(curIdx === -1) curIdx = 0;
  let html = '<div class="stepper">';
  steps.forEach((s, i)=>{
    let cls = "step";
    if(i < curIdx) cls += " done";
    else if(i === curIdx){
      if(s.cls === "active-amber") cls += " active-amber";
      else if(s.cls === "active-green" && status === "수락(채택)") cls += " active-green";
      else if(s.key === "완료" && status === "완료") cls += " done";
      else cls += " done";
    } else if(s.key === "__end__"){
      cls += " muted-end";
    }
    html += `<div class="${cls}"><div class="line"></div><div class="dot"></div><div class="lbl">${s.label}</div></div>`;
  });
  html += '</div>';
  return html;
}
function badgeFor(status){
  const map = {
    "접수완료":"gray", "검토중":"blue", "수락(채택)":"green", "차기 검토":"amber", "완료":"navy"
  };
  const st = str(status) || '접수완료';
  return `<span class="badge ${map[st]||'gray'}">${escapeHtml(st)}</span>`;
}

function setFormField(key, val){
  state.formData[key] = val;
  const f = state.formData;
  if(key === "qtrYear" || key === "qtrQuarter"){
    f.qtr = (f.qtrYear && f.qtrQuarter) ? `${f.qtrYear}년 ${f.qtrQuarter}` : "";
  }
  if(key === "deptChoice" && val !== DEPT_CUSTOM){ f.deptCustom = ""; }
  // 채워진 항목의 오류 표시는 즉시 해제
  REQUIRED_STEPS.forEach(st => { if(state.formErrors[st.key] && st.ok(f)) delete state.formErrors[st.key]; });
  draft.save(f);

  const rerenderKeys = ["qtrYear","qtrQuarter","deptChoice","productType","kind"];
  if(rerenderKeys.includes(key)){ render(); }
  else { updateProgressBar(); }
}

function updateProgressBar(){
  const f = state.formData;
  const filled = REQUIRED_STEPS.filter(st => st.ok(f)).length;
  const total = REQUIRED_STEPS.length;
  const allDone = filled === total;
  // 채워진 항목의 오류 표시를 화면에서도 즉시 지움
  REQUIRED_STEPS.forEach(st => {
    if(!st.ok(f)) return;
    const el = document.querySelector(`.field[data-field="${st.key}"]`);
    if(el && el.classList.contains("has-error")){
      el.classList.remove("has-error");
      const m = el.querySelector(".err-msg");
      if(m) m.remove();
    }
  });
  const fill = document.querySelector(".progress-fill");
  const cnt = document.querySelector(".progress-head .cnt");
  const btn = document.querySelector(".submit-btn");
  if(fill){ fill.style.width = Math.round(filled/total*100) + "%"; fill.classList.toggle("done", allDone); }
  if(cnt){ cnt.textContent = allDone ? "모두 작성 완료" : `${filled} / ${total}`; cnt.classList.toggle("done", allDone); }
  if(btn && !btn.disabled){ btn.textContent = allDone ? "제출하기" : `제출하기 (${total-filled}개 항목이 남았습니다)`; }
}

function toggleTargetTag(tag){
  const arr = state.formData.targetSelected;
  const idx = arr.indexOf(tag);
  if(idx === -1){ arr.push(tag); } else { arr.splice(idx,1); }
  if(state.formErrors.target && arr.length) delete state.formErrors.target;
  draft.save(state.formData);
  render();
}

function showSubmitError(reason){
  const wrap = document.getElementById('main');
  if(!wrap) return;
  const old = document.getElementById('submitError');
  if(old) old.remove();
  const div = document.createElement('div');
  div.id = 'submitError';
  div.className = 'notice err';
  div.innerHTML = '<span><b>제출하지 못했습니다.</b> ' + escapeHtml(reason) + '</span>';
  wrap.insertBefore(div, wrap.firstChild);
  div.scrollIntoView({behavior:'smooth', block:'center'});
}

async function submitForm(){
  const f = state.formData;
  const oldErr = document.getElementById('submitError');
  if(oldErr) oldErr.remove();
  const finalTarget = f.targetSelected.join('·');
  const finalDept = resolveDept(f);

  // 미입력 항목을 화면에서 바로 알려주고 첫 항목으로 이동
  const errs = {};
  REQUIRED_STEPS.forEach(st => { if(!st.ok(f)) errs[st.key] = st.msg; });
  if(Object.keys(errs).length){
    state.formErrors = errs;
    render();
    const first = document.querySelector('.field.has-error');
    if(first){
      first.scrollIntoView({behavior:'smooth', block:'center'});
      const input = first.querySelector('input, textarea');
      if(input) setTimeout(()=>input.focus({preventScroll:true}), 350);
    }
    return;
  }
  state.formErrors = {};

  const payload = {
    qtr:f.qtr, dept:finalDept, owner:f.owner,
    productType:f.productType, productName:f.productName, productDetail:f.productDetail, kind:f.kind,
    target:finalTarget, background:f.background, effect:f.effect,
    ref:f.ref, email:f.email
  };

  if(API_URL){
    const submitBtn = document.querySelector('.submit-btn');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '제출 중...'; }
    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'}, // preflight 방지용
        body: JSON.stringify(payload)
      });
      const text = await res.text();
      let data;
      try{
        data = JSON.parse(text);
      }catch(parseErr){
        showSubmitError('Apps Script 웹앱의 액세스 권한이 "모든 사용자"로 설정되어 있지 않습니다. 관리자에게 문의해주세요. 작성하신 내용은 그대로 보관됩니다.');
        if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '제출하기'; }
        return;
      }
      if(!data.ok){
        showSubmitError(data.error || '알 수 없는 오류');
        if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '제출하기'; }
        return;
      }
      state.needs.push({...payload, id:data.id, submitted:data.submitted, status:"접수완료", holdReason:""});
      draft.clear();
      state.draftRestored = false;
      state.lastSubmittedId = data.id;
      state.view = "confirm";
      render();
    }catch(e){
      showSubmitError('네트워크 연결을 확인하신 뒤 다시 시도해주세요. 작성하신 내용은 그대로 보관됩니다.');
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '제출하기'; }
    }
    return;
  }

  // API 미설정 시 폴백: 로컬 저장(테스트용)
  const year = new Date().getFullYear();
  const seq = state.needs.length + 1;
  const id = `N-${year}-${String(seq).padStart(3,'0')}`;
  const now = new Date();
  const submitted = now.toISOString().slice(0,16).replace('T',' ');
  const newNeed = {...payload, id, submitted, status:"접수완료", holdReason:""};
  state.needs.push(newNeed);
  persistNeeds();
  draft.clear();
  state.draftRestored = false;
  state.lastSubmittedId = id;
  state.view = "confirm";
  render();
}

  return `
    <div class="confirm-wrap">
      <div class="confirm-check">&#10003;</div>
      <h2>접수가 완료됐어요</h2>
      <div class="confirm-code mono">${state.lastSubmittedId}</div>
      <p>요청서가 정상적으로 접수되었습니다. 위 접수번호로 진행 상황을 조회하실 수 있습니다.<br><br>
      디지털마케팅팀이 분기 단위로 모아 검토하며, 결과가 확정되면 이메일을 남기신 경우 메일로 안내드립니다. 남기지 않으셨더라도 아래 <b>진행현황</b>에서 언제든 확인하실 수 있습니다.</p>
      <button class="confirm-btn" onclick="goToProgressAfterSubmit()">진행현황에서 확인하기 →</button>
    </div>
  `;
}
function goToProgressAfterSubmit(){
  state.view = "browse";
  state.tab = "progress";
  state.searchQuery = "";
  state.highlightId = state.lastSubmittedId;
  render();
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function onSearchInput(v){
  state.searchQuery = v;
  state.highlightId = '';
  renderOnly();
}
function setSearchField(v){ state.searchField = v; state.highlightId=''; renderOnly(); }
function setStatusFilter(v){ state.filterStatus = v; state.highlightId=''; renderOnly(); }
function setQtrFilter(v){ state.filterQtr = v; state.highlightId=''; renderOnly(); }
function clearFilters(){
  state.searchQuery = '';
  state.searchField = 'all';
  state.filterStatus = 'all';
  state.filterQtr = 'all';
  state.highlightId = '';
  renderOnly();
}
function hasActiveFilter(){
  return !!state.searchQuery || state.searchField !== 'all'
      || state.filterStatus !== 'all' || state.filterQtr !== 'all';
}

/* 검색 대상 정의 — 라벨과 실제 조회 필드를 한 곳에서 관리 */
const SEARCH_FIELDS = [
  {key:'all',     label:'전체 항목',        pick:n => [n.id,n.owner,n.dept,n.productName,n.productDetail,n.productType,n.kind,n.target,n.qtr,n.background,n.effect,n.status]},
  {key:'id',      label:'접수번호',          pick:n => [n.id]},
  {key:'owner',   label:'작성자',            pick:n => [n.owner]},
  {key:'dept',    label:'요청부서',          pick:n => [n.dept]},
  {key:'product', label:'제품·서비스',       pick:n => [n.productName, n.productDetail, n.productType]},
  {key:'kind',    label:'세미나종류',        pick:n => [n.kind]},
  {key:'target',  label:'목표고객',          pick:n => [n.target]},
  {key:'text',    label:'요청사유·기대효과', pick:n => [n.background, n.effect]}
];
const STATUS_OPTIONS = ['접수완료','검토중','수락(채택)','차기 검토','완료'];

function matchesSearch(n, q, fieldKey){
  const def = SEARCH_FIELDS.find(f => f.key === fieldKey) || SEARCH_FIELDS[0];
  return def.pick(n).some(v => str(v).toLowerCase().includes(q));
}

/* 검색어와 일치하는 부분을 표시 (이스케이프 이후에 적용) */
function hl(value, q){
  const safe = escapeHtml(value);
  if(!q) return safe;
  const target = escapeHtml(q);
  if(!target) return safe;
  const esc = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try{
    return safe.replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
  }catch(e){ return safe; }
}
function renderOnly(){
  // 목록만 다시 그리되, 검색창의 입력 위치(커서)는 그대로 유지
  if(state.view === 'browse' && state.tab === 'progress'){
    const listWrap = document.getElementById('progressListWrap');
    if(listWrap){
      const before = document.getElementById('progressSearch');
      const pos = before ? before.selectionStart : null;
      const wasFocused = !!before && document.activeElement === before;
      listWrap.innerHTML = renderProgressList();
      if(wasFocused){
        const after = document.getElementById('progressSearch');
        if(after){
          after.focus({preventScroll:true});
          if(pos !== null){ try{ after.setSelectionRange(pos, pos); }catch(e){} }
        }
      }
      return;
    }
  }
  render();
}

function render(){
  const header = document.getElementById('header');
  const app = document.getElementById('app');
  const browseRow = document.getElementById('browseHeaderRow');
  const browseTabs = document.getElementById('browseTabs');
  const formRow = document.getElementById('formHeaderRow');
  const main = document.getElementById('main');

  const isWide = (state.view !== 'form' && state.view !== 'confirm');
  app.classList.toggle('wide-view', isWide);

  if(state.view === 'form'){
    browseRow.classList.add('hidden');
    browseTabs.classList.add('hidden');
    formRow.classList.remove('hidden');
    main.innerHTML = renderForm();
    requestAnimationFrame(()=>{
      document.documentElement.style.setProperty('--hdr-h', header.offsetHeight + 'px');
    });
  } else if(state.view === 'confirm'){
    browseRow.classList.add('hidden');
    browseTabs.classList.add('hidden');
    formRow.classList.add('hidden');
    main.innerHTML = renderConfirm();
  } else {
    browseRow.classList.remove('hidden');
    browseTabs.classList.remove('hidden');
    formRow.classList.add('hidden');
    document.querySelectorAll('.tab-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab === state.tab);
    });
    if(state.tab === 'progress'){
      main.innerHTML = `<div id="progressListWrap">${renderProgressList()}</div>`;
    } else {
      main.innerHTML = renderArchiveList();
    }
  }
}

function escapeHtml(str){
  if(str === null || str === undefined || str === '') return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(str){
  if(str === null || str === undefined || str === '') return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* 시트 값이 숫자·날짜여도 문자열로 안전하게 다루기 위한 헬퍼 */
function str(v){ return (v === null || v === undefined) ? '' : String(v); }

/* sheet layer container */
const sheetLayer = document.createElement('div');
sheetLayer.id = 'sheetLayer';
document.body.appendChild(sheetLayer);

/* init */
loadStoredNeeds();
</script>
