<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세미나 기획 데스크 | NE능률 디지털마케팅팀</title>
<meta name="description" content="NE능률 디지털마케팅팀 세미나 요청 접수 및 진행현황 조회">
<meta name="theme-color" content="#0E2C55">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="세미나 기획 데스크">
<meta property="og:description" content="세미나 요청 접수 및 진행현황 조회">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E2C55'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'%3EN%3C/text%3E%3C/svg%3E">
<style>
  :root{
    /* 보고서 톤앤매너 — 잉크 네이비 기반, 절제된 강조색 */
    --navy:#0E2C55; --navy-deep:#081E3C; --navy-mid:#2C5A93;
    --navy-soft:#E6EEF7; --navy-line:#C7D6E8;
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F6F8FA;
    --ink:#1E2733; --ink-soft:#4A5563; --muted:#7C8695; --muted-soft:#EFF2F5;
    --line:#DDE2E8; --line-strong:#C8D0DA;
    --gold:#9A5B00; --gold-soft:#FCF1DE; --gold-line:#E3C08A;
    --green:#186043; --green-soft:#E6F1EB; --green-line:#A6CCB7;
    --blue:#2C5A93; --blue-soft:#E9F0F8;
    --red:#96201A; --red-soft:#FBEAE8; --red-line:#E0B3AE;
    --radius:6px;
    --shadow:0 1px 2px rgba(14,44,85,.05), 0 6px 18px rgba(14,44,85,.05);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{-webkit-font-smoothing:antialiased;letter-spacing:-.005em;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.01em;}

  #app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--surface);
       display:flex;flex-direction:column;transition:max-width .15s ease;
       box-shadow:0 0 0 1px var(--line);}
  #app.wide-view{max-width:1280px;}
  @media (max-width:1340px){ #app.wide-view{max-width:100%;} }

  /* ---------- Header ---------- */
  header.top{
    position:sticky;top:0;z-index:20;background:var(--surface);
    border-bottom:2.5px solid var(--navy);padding:20px 26px 0 26px;
  }
  .brand-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
             margin-bottom:16px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:3px;}
  .brand .mark{font-size:11px;letter-spacing:.14em;color:var(--navy-mid);font-weight:700;}
  .brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--navy);}
  .new-btn{
    background:var(--navy);color:#fff;border:none;border-radius:var(--radius);
    padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
    white-space:nowrap;letter-spacing:-.01em;
  }
  .new-btn:hover{background:var(--navy-deep);}
  .tabs{display:flex;gap:22px;}
  .tab-btn{
    background:none;border:none;color:var(--muted);font-family:inherit;
    font-size:14px;font-weight:700;padding:0 2px 11px 2px;cursor:pointer;
    border-bottom:2.5px solid transparent;margin-bottom:-2.5px;letter-spacing:-.01em;
  }
  .tab-btn:hover{color:var(--ink-soft);}
  .tab-btn.active{color:var(--navy);border-bottom-color:var(--navy);}

  .back-row{display:flex;align-items:center;gap:12px;padding-bottom:16px;}
  .back-link{background:none;border:none;color:var(--navy-mid);font-size:13px;cursor:pointer;
             padding:0;font-weight:700;font-family:inherit;}
  .back-link:hover{color:var(--navy);text-decoration:underline;}
  .page-title{font-size:16px;font-weight:800;color:var(--navy);letter-spacing:-.02em;}

  main{flex:1;padding:20px 26px 110px 26px;}

  /* ---------- Notice strip ---------- */
  .notice{
    display:flex;align-items:flex-start;gap:8px;
    background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--navy-mid);
    border-radius:0 var(--radius) var(--radius) 0;
    padding:9px 13px;font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:10px;
  }
  .notice b{color:var(--ink);font-weight:700;}
  .notice.warn{border-left-color:var(--gold);background:var(--gold-soft);border-color:var(--gold-line);color:#6E4300;}
  .notice.err{border-left-color:var(--red);background:var(--red-soft);border-color:var(--red-line);color:#7A1B16;}
  .notice .n-act{margin-left:auto;flex:none;}
  .notice button{
    background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;
    padding:5px 11px;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit;
  }
  .conn{font-size:11.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--muted);}
  .conn .led{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none;}
  .conn.live{color:var(--green);} .conn.live .led{background:var(--green);}
  .conn.local{color:var(--gold);} .conn.local .led{background:var(--gold);}

  /* ---------- Search / filter ---------- */
  .search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .search-bar input{
    flex:1;min-width:200px;border:1px solid var(--line-strong);border-radius:var(--radius);
    padding:9px 12px;font-size:13.5px;font-family:inherit;color:var(--ink);background:var(--surface);
  }
  .search-bar input:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:var(--navy);}
  .filter-pills{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .pill{
    border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);
    padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;
    font-family:inherit;white-space:nowrap;
  }
  .pill:hover{border-color:var(--navy-mid);color:var(--navy);}
  .pill.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .toolbar{margin-bottom:12px;}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;}
  select.ctrl{
    border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);
    padding:8px 11px;font-size:12.5px;font-family:inherit;font-weight:700;color:var(--ink-soft);
    cursor:pointer;max-width:200px;
  }
  select.ctrl:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:var(--navy);}
  select.ctrl.on{border-color:var(--navy);color:var(--navy);background:var(--navy-soft);}
  .pill.ghost{border-style:dashed;color:var(--muted);}
  .pill.ghost:hover{border-style:solid;}
  .refresh-btn{
    display:inline-flex;align-items:center;gap:6px;margin-left:auto;
    border:1px solid var(--navy);background:var(--surface);border-radius:var(--radius);
    padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;font-family:inherit;
    white-space:nowrap;
  }
  .refresh-btn:hover{background:var(--navy);color:#fff;}
  .refresh-btn:disabled{opacity:.55;cursor:progress;background:var(--surface);color:var(--navy);}
  .refresh-btn .ico{
    width:11px;height:11px;border:2px solid currentColor;border-top-color:transparent;
    border-radius:50%;display:inline-block;
  }
  .refresh-btn.spin .ico{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .result-line{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 8px 0;
  }
  .result-line b{color:var(--navy);font-weight:800;}
  .result-line .stamp{color:var(--muted);font-weight:600;}
  mark{background:var(--gold-soft);color:#6E4300;font-weight:800;padding:0 1px;border-radius:2px;}

  /* ---------- 툴팁 ---------- */
  .tip{position:relative;}
  .tip::after{
    content:attr(data-tip);
    position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%) translateY(-4px);
    background:var(--navy-deep);color:#fff;font-size:11.5px;font-weight:600;line-height:1.55;
    padding:8px 11px;border-radius:5px;white-space:pre-line;width:max-content;max-width:230px;
    opacity:0;pointer-events:none;transition:opacity .16s ease, transform .16s ease;z-index:30;
    box-shadow:0 4px 14px rgba(8,30,60,.24);text-align:left;letter-spacing:-.01em;
  }
  .tip::before{
    content:"";position:absolute;left:50%;top:calc(100% + 3px);transform:translateX(-50%);
    border:5px solid transparent;border-bottom-color:var(--navy-deep);
    opacity:0;pointer-events:none;transition:opacity .16s ease;z-index:31;
  }
  .tip:hover::after,.tip:focus-visible::after{opacity:1;transform:translateX(-50%) translateY(0);}
  .tip:hover::before,.tip:focus-visible::before{opacity:1;}
  @media (max-width:640px){ .tip::after,.tip::before{display:none;} }

  /* ---------- 안내 팝업 ---------- */
  .ob-backdrop{
    position:fixed;inset:0;z-index:60;background:rgba(10,24,44,.52);
    display:flex;align-items:center;justify-content:center;padding:20px;
    animation:obFade .22s ease both;
  }
  .ob-backdrop.closing{animation:obFadeOut .18s ease both;}
  @keyframes obFade{from{opacity:0}to{opacity:1}}
  @keyframes obFadeOut{from{opacity:1}to{opacity:0}}
  .ob-card{
    background:var(--surface);border-radius:12px;max-width:540px;width:100%;
    max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(8,26,52,.35);
    animation:obRise .34s cubic-bezier(.2,.8,.25,1) both;
  }
  .ob-backdrop.closing .ob-card{animation:obSink .18s ease both;}
  @keyframes obRise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes obSink{from{opacity:1;transform:none}to{opacity:0;transform:translateY(12px) scale(.985)}}
  .ob-head{background:var(--navy);color:#fff;padding:24px 28px 22px 28px;border-radius:12px 12px 0 0;}
  .ob-head .eyebrow{font-size:11px;letter-spacing:.14em;font-weight:700;opacity:.72;margin-bottom:7px;}
  .ob-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.4;}
  .ob-body{padding:24px 28px 8px 28px;}
  .ob-flow{display:flex;align-items:center;gap:6px;margin-bottom:22px;}
  .ob-flow .st{
    flex:1;text-align:center;border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 6px;background:var(--surface-2);
    animation:obPop .4s cubic-bezier(.2,.8,.25,1) both;
  }
  .ob-flow .st:nth-child(1){animation-delay:.14s} .ob-flow .st:nth-child(3){animation-delay:.24s}
  .ob-flow .st:nth-child(5){animation-delay:.34s}
  .ob-flow .st.on{background:var(--navy-soft);border-color:var(--navy-line);}
  .ob-flow .st .n{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.08em;display:block;margin-bottom:3px;}
  .ob-flow .st .t{font-size:12.5px;font-weight:800;color:var(--navy);}
  .ob-flow .ar{color:var(--muted);font-size:13px;flex:none;}
  @keyframes obPop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ob-list{margin:0;padding:0;list-style:none;}
  .ob-list li{
    position:relative;padding-left:26px;margin-bottom:13px;font-size:13.5px;line-height:1.72;color:var(--ink-soft);
  }
  .ob-list li b{color:var(--ink);font-weight:800;}
  .ob-list li .num{
    position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:50%;
    background:var(--navy-soft);color:var(--navy);font-size:10.5px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .ob-point{
    background:var(--gold-soft);border:1px solid var(--gold-line);color:#6E4300;
    border-radius:var(--radius);padding:12px 14px;font-size:13px;line-height:1.7;margin-top:4px;
  }
  .ob-foot{
    padding:18px 28px 24px 28px;display:flex;align-items:center;justify-content:space-between;
    gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:20px;
  }
  .ob-check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:600;}
  .ob-check input{width:15px;height:15px;accent-color:var(--navy);cursor:pointer;}
  .ob-btn{
    background:var(--navy);color:#fff;border:none;border-radius:var(--radius);
    padding:12px 30px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:-.01em;
  }
  .ob-btn:hover{background:var(--navy-deep);}
  .help-link{
    background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;
    cursor:pointer;font-family:inherit;padding:0 2px 11px 2px;margin-bottom:-2.5px;
    border-bottom:2.5px solid transparent;
  }
  .help-link:hover{color:var(--navy);}

  /* ---------- 상태 반짝임 ---------- */
  .badge .dot-live{
    display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;
    margin-right:5px;vertical-align:1px;position:relative;
    animation:blink 1.35s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.72)}}
  @media (prefers-reduced-motion:reduce){
    .badge .dot-live{animation:none}
    .ob-card,.ob-backdrop,.ob-flow .st{animation:none!important}
  }

  /* ---------- 페이지네이션 ---------- */
  .pager{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin-top:14px;
  }
  .pager-left{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600;}
  .pager-nav{display:flex;align-items:center;gap:5px;}
  .pg{
    min-width:32px;height:32px;padding:0 9px;border:1px solid var(--line-strong);background:var(--surface);
    border-radius:var(--radius);font-size:12.5px;font-weight:700;color:var(--ink-soft);
    cursor:pointer;font-family:inherit;
  }
  .pg:hover:not(:disabled){border-color:var(--navy);color:var(--navy);}
  .pg.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .pg:disabled{opacity:.4;cursor:default;}
  .pg-gap{color:var(--muted);font-size:12px;padding:0 2px;}

  /* ---------- Table ---------- */
  /* 표 자체에는 세로 스크롤을 두지 않습니다.
     선택한 개수(5·10·20건)가 항상 한 번에 보이고, 부족한 만큼만 페이지 전체가 움직입니다. */
  .archive-table-wrap{
    border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
    overflow:visible;
  }
  table.archive-table{
    border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;line-height:1.45;
    table-layout:fixed;
  }
  table.archive-table thead th{
    position:sticky;top:var(--hdr-h,0px);background:var(--navy);color:#fff;text-align:left;font-weight:600;
    padding:9px 12px;white-space:nowrap;z-index:2;font-size:12px;letter-spacing:-.01em;
    border-right:1px solid rgba(255,255,255,.14);
    overflow:hidden;text-overflow:ellipsis;
  }
  table.archive-table thead th:first-child{border-top-left-radius:var(--radius);}
  table.archive-table thead th:last-child{border-top-right-radius:var(--radius);}
  table.archive-table thead th:last-child{border-right:none;}
  table.archive-table thead th.sortable{cursor:pointer;user-select:none;}
  table.archive-table thead th.sortable:hover{background:var(--navy-deep);}
  table.archive-table thead th.sortable.on{background:var(--navy-deep);}
  .th-in{display:flex;align-items:center;justify-content:space-between;gap:5px;min-width:0;}
  .th-in > span:first-child{overflow:hidden;text-overflow:ellipsis;}
  .sort-arrow{font-size:9px;opacity:.4;letter-spacing:-1px;flex:none;}
  th.sortable.on .sort-arrow{opacity:1;}
  table.archive-table td{
    padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink);
    vertical-align:top;overflow:hidden;text-overflow:ellipsis;
    word-break:break-word;
  }
  table.archive-table tbody tr:last-child td{border-bottom:none;}
  /* 긴 글은 두 줄까지만 보여주고 나머지는 줄임표로 접습니다. 전체 내용은 행을 눌러 확인합니다. */
  .clamp2{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;text-overflow:ellipsis;
  }
  table.archive-table td.col-date{white-space:nowrap;}
  table.archive-table td.col-qtr{white-space:nowrap;}
  table.archive-table td.cell-link{color:var(--blue);font-weight:700;}
  table.archive-table th.num, table.archive-table td.num{padding-left:6px;padding-right:6px;text-align:right;}
  table.archive-table th.num .th-in{justify-content:flex-end;}
  table.archive-table td.cell-sub, .cell-sub{color:var(--muted);font-size:11px;}
  table.archive-table tbody tr:nth-child(even){background:#FAFBFC;}
  table.archive-table tbody tr:hover{background:var(--navy-soft);cursor:pointer;}
  table.archive-table tbody tr.row-highlight{background:var(--gold-soft)!important;box-shadow:inset 3px 0 0 var(--gold);}
  tr.table-group-row td{
    font-size:12px;font-weight:800;color:var(--navy);background:var(--navy-soft);
    padding:7px 12px;border-bottom:1px solid var(--navy-line);letter-spacing:-.01em;
  }
  .kind-chip{
    display:inline-block;background:var(--muted-soft);color:var(--ink-soft);border:1px solid var(--line);
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;white-space:nowrap;
  }
  .type-tag{
    display:inline-block;background:var(--navy-soft);color:var(--navy);border:1px solid var(--navy-line);
    font-size:10px;font-weight:800;padding:1px 6px;border-radius:3px;margin-right:5px;vertical-align:1px;
  }
  .new-flag-inline{
    display:inline-block;background:var(--gold);color:#fff;font-size:9.5px;font-weight:800;
    padding:1px 6px;border-radius:3px;vertical-align:1px;margin-left:4px;letter-spacing:.04em;
  }
  .badge{
    display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:3px;
    white-space:nowrap;border:1px solid transparent;
  }
  .badge.gray{background:var(--muted-soft);color:var(--ink-soft);border-color:var(--line);}
  .badge.blue{background:var(--blue-soft);color:var(--blue);border-color:var(--navy-line);}
  .badge.green{background:var(--green-soft);color:var(--green);border-color:var(--green-line);}
  .badge.amber{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-line);}
  .badge.navy{background:var(--navy);color:#fff;border-color:var(--navy);}

  .empty{text-align:center;padding:56px 20px;color:var(--muted);font-size:13.5px;line-height:1.7;}
  .empty .big{font-size:13px;font-weight:800;color:var(--ink-soft);margin-bottom:8px;letter-spacing:.06em;}

  /* ---------- Detail sheet ---------- */
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(14,30,50,.46);z-index:40;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--surface);width:100%;max-width:760px;border-radius:10px 10px 0 0;
    padding:24px 26px 30px 26px;max-height:88vh;overflow-y:auto;
    box-shadow:0 -8px 40px rgba(0,0,0,.22);
  }
  .sheet-handle{width:38px;height:4px;background:var(--line-strong);border-radius:4px;margin:0 auto 16px auto;}
  .sheet h2{font-size:17.5px;margin:0 0 5px 0;font-weight:800;letter-spacing:-.02em;color:var(--navy);line-height:1.4;}
  .sheet .sheet-code{font-size:12px;color:var(--muted);margin-bottom:18px;font-weight:700;}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:9px 14px;font-size:13.5px;margin-bottom:7px;}
  .kv .k{color:var(--ink-soft);font-weight:700;}
  .kv .v{color:var(--ink);}
  .sheet-section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .sheet-close{
    position:absolute;top:16px;right:18px;background:var(--muted-soft);border:1px solid var(--line);

/* =========================================================
   구글시트 연동 설정
   Apps Script 배포 후 나오는 웹앱 URL을 아래에 붙여넣으면
   실제 구글시트와 연동되어 동작합니다. 비워두면 브라우저 로컬 저장(테스트용)으로 동작합니다.
   ========================================================= */
/* ★★★ 여기만 바꾸시면 됩니다 ★★★
   Apps Script → 배포 → 배포 관리 → "웹 앱" URL 을 복사해 아래 따옴표 안에 붙여넣으세요.
   비워두면("") 구글시트 없이 로컬 데모 모드로 동작합니다.
   주의: "새 배포"를 누르면 URL이 새로 생성되므로 아래 값도 함께 바꿔야 합니다.
        URL을 유지하려면 "배포 관리 → 수정(연필) → 버전: 새 버전 → 배포"를 사용하세요. */
const API_URL = "https://script.google.com/macros/s/AKfycbyfYLjVZnaHJld8TjSukzirSI5J9rKWuG2FuzV3jMqI_2WOmYKmgdMQXJevBNsSVSFT/exec";

/* 브라우저 저장소 안전 래퍼 (구글시트 미연동 시에만 사용) */
const localStore = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

async function loadStoredNeeds(isRefresh){
  if(API_URL){
    if(!isRefresh){
      state.connection = 'loading';
      render();
    }
    try{
      const res = await fetch(API_URL, {method:'GET'});
      if(res.status === 404) throw new Error('NOTFOUND');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      let data;
      try{
        data = JSON.parse(text);
      }catch(parseErr){
        // JSON이 아니라 HTML(구글 로그인 페이지)이 돌아온 경우
        throw new Error('AUTH');
      }
      if(!data.ok) throw new Error(data.error || '시트에서 오류를 반환했습니다.');
      state.needs = Array.isArray(data.needs) ? data.needs : [];
      if(Array.isArray(data.depts) && data.depts.length){
        state.deptOptions = data.depts;
      }
      state.connection = 'live';
      state.loadError = '';
      state.lastLoaded = new Date();
      renderSafely();
      return;
    }catch(e){
      // 연동 실패 시 목업 데이터를 실데이터처럼 보여주지 않고 오류 상태로 명확히 표시
      console.error('구글시트 연동 실패:', e);
      state.needs = [];
      state.connection = 'error';
      state.loadError = (e && e.message) ? e.message : '알 수 없는 오류';
      render();
      return;
    }
  }
  // 구글시트 미연동(로컬 데모) 모드
  state.connection = 'local';
  state.lastLoaded = new Date();
  try{
    const raw = localStore.get('needs-submissions');
    state.needs = raw ? seedNeeds.concat(JSON.parse(raw)) : seedNeeds.slice();
  }catch(e){
    state.needs = seedNeeds.slice();
  }
  render();
}

function renderSafely(){
  try{ render(); }

/* ---------- 날짜 표기 ----------
   구글시트 셀 서식에 따라 날짜가 여러 형태로 들어옵니다.
   - "2026-08-23 14:30"        (텍스트 서식)
   - "2026-08-23T05:30:00.000Z" (날짜 서식 → JSON 변환)
   - "Sun Aug 23 2026 02:05:00 GMT+0900 (한국 표준시)" (텍스트 셀에 날짜 객체가 들어간 경우)
   어떤 형태로 와도 "2026년 8월 23일"로 통일해 보여줍니다. */
function fromDateObj(d){
  return {y:d.getFullYear(), mo:d.getMonth()+1, d:d.getDate(), h:d.getHours(), mi:d.getMinutes()};
}
const MONTH_EN = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
function parseDate(v){
  if(v instanceof Date && !isNaN(v.getTime())) return fromDateObj(v);
  const t = str(v).trim();
  if(!t) return null;

  // 1) "Sun Aug 23 2026 02:05:00 GMT+0900" — 이미 현지 시각이 적혀 있으므로 글자 그대로 읽습니다
  //    (Date로 다시 해석하면 보는 사람의 시간대에 따라 날짜가 하루 밀릴 수 있습니다)
  const en = t.match(/^[A-Za-z]{3}\s+([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(en && MONTH_EN[en[1]]){
    return {y:+en[3], mo:MONTH_EN[en[1]], d:+en[2],
            h:en[4]!==undefined?+en[4]:null, mi:en[5]!==undefined?+en[5]:null};
  }

  // 2) 시간대가 명시된 ISO 형식 (…Z, …+09:00) — 한국 시각으로 변환해 보여줍니다
  if(/^\d{4}-\d{2}-\d{2}T/.test(t) && /(Z|[+-]\d{2}:?\d{2})$/.test(t)){
    const d = new Date(t);
    if(!isNaN(d.getTime())) return fromDateObj(d);
  }

  // 3) yyyy-mm-dd / yyyy.mm.dd / yyyy/mm/dd (+ 시:분) — 적힌 그대로
  const m = t.match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m) return {y:+m[1], mo:+m[2], d:+m[3], h:m[4]!==undefined?+m[4]:null, mi:m[5]!==undefined?+m[5]:null};

  // 4) 그 밖의 형태는 브라우저 해석에 맡깁니다
  const d = new Date(t);
  if(!isNaN(d.getTime())) return fromDateObj(d);
  return null;
}
/* 정렬·비교용 숫자값 (형식이 섞여 있어도 올바른 순서로 정렬됩니다) */
function dateVal(v){
  const p = parseDate(v);
  if(!p) return 0;
  return ((p.y*100 + p.mo)*100 + p.d)*10000 + (p.h||0)*100 + (p.mi||0);
}
/* 목록용 — 2026년 8월 23일 */
function dateKo(v){
  const p = parseDate(v);
  if(!p) return str(v);
  return `${p.y}년 ${p.mo}월 ${p.d}일`;
}
/* 상세용 — 2026년 8월 23일 오전 2시 5분 */
function dateTimeKo(v){
  const p = parseDate(v);
  if(!p) return str(v);
  let out = `${p.y}년 ${p.mo}월 ${p.d}일`;
  if(p.h !== null){
    const ampm = p.h < 12 ? '오전' : '오후';
    const h12 = p.h % 12 === 0 ? 12 : p.h % 12;
    out += ` ${ampm} ${h12}시${p.mi ? ` ${p.mi}분` : ''}`;
  }
  return out;
}

function setPageSize(v){ state.pageSize = parseInt(v,10) || 10; state.page = 1; renderOnly(); }
function goPage(n){
  state.page = n;
  renderOnly();
  const wrap = document.getElementById('progressListWrap');
  if(wrap) wrap.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderPager(totalItems, opts){
  const o = opts || {};
  const size = o.size || state.pageSize;
  const cur0 = o.cur || state.page;
  const sizeFn = o.sizeFn || 'setPageSize';
  const goFn = o.goFn || 'goPage';
  const pages = Math.max(1, Math.ceil(totalItems / size));
  const cur = Math.min(cur0, pages);
  const from = totalItems === 0 ? 0 : (cur-1)*size + 1;
  const to = Math.min(cur*size, totalItems);

  // 현재 페이지 주변만 노출하고 나머지는 생략 부호로 접습니다
  const nums = [];
  const push = n => { if(!nums.includes(n)) nums.push(n); };
  push(1);
  for(let i = cur-1; i <= cur+1; i++){ if(i > 1 && i < pages) push(i); }
  if(pages > 1) push(pages);
  nums.sort((a,b)=>a-b);

  let btns = '';
  let prev = 0;
  nums.forEach(n => {
    if(prev && n - prev > 1) btns += `<span class="pg-gap">···</span>`;
    btns += `<button type="button" class="pg ${n===cur?'on':''}" onclick="${goFn}(${n})">${n}</button>`;
    prev = n;
  });

  return `<div class="pager">
    <div class="pager-left">
      <span>${totalItems}건 중 <b style="color:var(--navy)">${from}–${to}</b></span>
      <select class="ctrl" onchange="${sizeFn}(this.value)" aria-label="한 페이지에 보여줄 건수" style="padding:6px 9px;">
        ${[5,10,20].map(v=>`<option value="${v}" ${size===v?'selected':''}>${v}개씩 보기</option>`).join('')}
      </select>
    </div>
    <div class="pager-nav">
      <button type="button" class="pg" onclick="${goFn}(${cur-1})" ${cur<=1?'disabled':''} aria-label="이전 페이지">‹</button>
      ${btns}
      <button type="button" class="pg" onclick="${goFn}(${cur+1})" ${cur>=pages?'disabled':''} aria-label="다음 페이지">›</button>
    </div>
  </div>`;
}

function stampText(){
  if(!state.lastLoaded) return '';
  const d = state.lastLoaded;
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} 기준`;
}

}

/* 목록 정렬 정의 — 컬럼 헤더 클릭 시 사용 */
const STATUS_ORDER = ['접수완료','검토중','수락(채택)','차기 검토','완료'];
const SORT_COLS = {
  submitted: {label:'제출일',     val:n => dateVal(n.submitted)},
  status:    {label:'상태',       val:n => { const i = STATUS_ORDER.indexOf(str(n.status)); return i === -1 ? 99 : i; }},
  qtr:       {label:'희망 시기',  val:n => { const i = QUARTERS_ALL.indexOf(str(n.qtr));   return i === -1 ? 999 : i; }},
  kind:      {label:'세미나종류', val:n => str(n.kind)},
  product:   {label:'제품·서비스', val:n => str(n.productName) + ' ' + str(n.productDetail)},
  target:    {label:'목표고객',   val:n => str(n.target)},
  id:        {label:'접수번호',   val:n => str(n.id)}
};

/* 같은 컬럼을 다시 누르면 오름/내림이 뒤바뀝니다 */
function sortBy(key){
  if(state.sortKey === key){
    state.sortDir = (state.sortDir === 'asc') ? 'desc' : 'asc';
  } else {
    state.sortKey = key;
    // 날짜는 최신순, 나머지는 오름차순으로 시작하는 편이 자연스럽습니다
    state.sortDir = (key === 'submitted') ? 'desc' : 'asc';
  }
  if(key !== 'qtr') state.groupByQtr = false;
  state.page = 1;
  renderOnly();
}
function arrowFor(key){
  if(state.sortKey !== key) return '<span class="sort-arrow">▲▼</span>';
  return `<span class="sort-arrow">${state.sortDir === 'asc' ? '▲' : '▼'}</span>`;
}
function thSort(key, extraClass){
  const on = state.sortKey === key;
  return `<th class="${extraClass||''} sortable ${on?'on':''}" onclick="sortBy('${key}')"
    title="클릭하면 ${SORT_COLS[key].label} 기준으로 정렬됩니다"><span class="th-in"><span>${SORT_COLS[key].label}</span>${arrowFor(key)}</span></th>`;
}

function toggleSubmittedSort(){
  sortBy('submitted');
  renderOnly();
}
function toggleQtrGrouping(){
  state.groupByQtr = !state.groupByQtr;
  if(state.groupByQtr){ state.sortKey = 'qtr'; state.sortDir = 'asc'; }
  else { state.sortKey = 'submitted'; state.sortDir = 'desc'; }
  state.page = 1;
  renderOnly();
}
function sortNeeds(list){
  const def = SORT_COLS[state.sortKey] || SORT_COLS.submitted;
  const dir = state.sortDir === 'asc' ? 1 : -1;
  const cmp = (x, y) => {
    if(typeof x === 'number' && typeof y === 'number') return x - y;
    return String(x).localeCompare(String(y), 'ko');
  };
  return list.slice().sort((a, b) => {
    const r = cmp(def.val(a), def.val(b));
    if(r !== 0) return r * dir;
    // 값이 같으면 항상 최신 제출 건이 위로
    return dateVal(b.submitted) - dateVal(a.submitted);
  });
}

/* =========================================================
   STEPPER LOGIC (signature element)
   ========================================================= */
function stepConfig(status){
  const base = [
    {label:"접수완료", key:"접수완료"},
    {label:"검토중", key:"검토중"},
  ];
  if(status === "차기 검토"){
    base.push({label:"차기 검토", key:"차기 검토", cls:"active-amber"});
    base.push({label:"종료(재검토)", key:"__end__", cls:"muted-end"});
  } else {
    base.push({label:"수락(채택)", key:"수락(채택)", cls:"active-green"});
    base.push({label:"완료", key:"완료", cls:"done-final"});
  }
  return base;
}
function renderStepper(status){
  const steps = stepConfig(status);
  const order = steps.map(s=>s.key);
  let curIdx = order.indexOf(status);
  if(curIdx === -1) curIdx = 0;
  let html = '<div class="stepper">';
  steps.forEach((s, i)=>{
    let cls = "step";
    if(i < curIdx) cls += " done";
    else if(i === curIdx){
      if(s.cls === "active-amber") cls += " active-amber";
      else if(s.cls === "active-green" && status === "수락(채택)") cls += " active-green";
      else if(s.key === "완료" && status === "완료") cls += " done";
      else cls += " done";
    } else if(s.key === "__end__"){
      cls += " muted-end";
    }
    html += `<div class="${cls}"><div class="line"></div><div class="dot"></div><div class="lbl">${s.label}</div></div>`;
  });
  html += '</div>';
  return html;
}
function badgeFor(status){
  const map = {
    "접수완료":"gray", "검토중":"blue", "수락(채택)":"green", "차기 검토":"amber", "완료":"navy"
  };
  const st = str(status) || '접수완료';
  // 지금 실제로 검토가 진행 중인 건은 눈에 띄도록 표시합니다
  const live = (st === '검토중') ? '<span class="dot-live"></span>' : '';
  return `<span class="badge ${map[st]||'gray'}">${live}${escapeHtml(st)}</span>`;
}

    html += `<td class="mono">${hl(n.id, q)}</td>`;
    html += `</tr>`;
  });

  html += `</tbody></table></div>`;
  html += renderPager(list.length);
  return html;
}

   RENDER: BROWSE - ARCHIVE TAB

/* 진행완료 세미나 정렬 기준 */
const ARCHIVE_SORT = {
  date:       {label:'날짜',       val:a => dateVal(a.date)},
  kind:       {label:'종류',       val:a => str(a.kind)},
  product:    {label:'교재·서비스', val:a => str(a.product)},
  name:       {label:'세미나명',   val:a => str(a.name)},
  applied:    {label:'신청',       val:a => Number(a.applied) || 0},
  attended:   {label:'참석',       val:a => Number(a.attended) || 0},
  rate:       {label:'참석률',     val:a => a.applied ? (a.attended/a.applied) : -1},
  instructor: {label:'강사·학원',  val:a => str(a.instructor)}
};
function archiveSortBy(key){
  if(state.archiveSortKey === key){
    state.archiveSortDir = (state.archiveSortDir === 'asc') ? 'desc' : 'asc';
  } else {
    state.archiveSortKey = key;
    state.archiveSortDir = (key === 'date' || key === 'applied' || key === 'attended' || key === 'rate') ? 'desc' : 'asc';
  }
  render();
}
function aTh(key, cls){
  const on = state.archiveSortKey === key;
  const arrow = on ? (state.archiveSortDir === 'asc' ? '▲' : '▼') : '▲▼';
  return `<th class="${cls||''} sortable ${on?'on':''}" onclick="archiveSortBy('${key}')"
    title="클릭하면 ${ARCHIVE_SORT[key].label} 기준으로 정렬됩니다"><span class="th-in"><span>${ARCHIVE_SORT[key].label}</span><span class="sort-arrow">${arrow}</span></span></th>`;
}
function sortArchive(list){
  const def = ARCHIVE_SORT[state.archiveSortKey] || ARCHIVE_SORT.date;
  const dir = state.archiveSortDir === 'asc' ? 1 : -1;
  return list.map((a,i)=>({a,i})).sort((x,y)=>{
    const vx = def.val(x.a), vy = def.val(y.a);
    let r;
    if(typeof vx === 'number' && typeof vy === 'number') r = vx - vy;
    else r = String(vx).localeCompare(String(vy), 'ko');
    if(r !== 0) return r * dir;
    return dateVal(y.a.date) - dateVal(x.a.date);
  });
}

          + aTh('applied','num') + aTh('attended','num') + aTh('rate','num') + aTh('instructor')
          + `<th>영상</th><th>메모</th>`;
  } else {
    html += aTh('date','col-date') + aTh('kind','col-kind') + aTh('name','col-title') + aTh('instructor')
          + `<th>영상</th><th>메모</th>`;
  }
  html += `</tr></thead><tbody>`;

  const aPages = Math.max(1, Math.ceil(data.length / state.archivePageSize));
  if(state.archivePage > aPages) state.archivePage = aPages;
  const aStart = (state.archivePage - 1) * state.archivePageSize;
  sortArchive(data).slice(aStart, aStart + state.archivePageSize).forEach(({a, i: idx})=>{
    const rate = (a.applied ? Math.round((a.attended/a.applied)*1000)/10 : null);
    html += `<tr onclick="openArchiveDetail('${state.archiveFilter}', ${idx})">`;

    }
    html += `<td class="col-title" title="${escapeAttr(a.name)}"><div class="clamp2">${escapeHtml(a.name)}</div></td>`;
    if(isGeneral){
      html += `<td class="num">${a.applied ?? ''}</td><td class="num">${a.attended ?? ''}</td><td class="num">${rate!==null ? rate+'%' : ''}</td>`;
    }
    html += `<td><div class="clamp2">${escapeHtml(a.instructor)}</div></td>`;
    html += `<td class="cell-link" title="${escapeAttr(a.video)}">${a.video ? '링크' : ''}</td>`;
    html += `<td title="${escapeAttr(a.memo)}"><div class="clamp2">${escapeHtml(a.memo)}</div></td>`;

  html += `</tbody></table></div>`;

const OB_SESSION_KEY = 'seminar-onboard-shown';
const OB_HIDE_KEY = 'seminar-onboard-hide';

function shouldShowOnboarding(){
  try{
    if(localStorage.getItem(OB_HIDE_KEY) === '1') return false;      // 다시 보지 않기 선택
    if(sessionStorage.getItem(OB_SESSION_KEY) === '1') return false; // 이번 방문에 이미 봄
  }catch(e){}
  return true;
}

function openOnboarding(force){
  if(!force && !shouldShowOnboarding()) return;
  state.onboardOpen = true;
  try{ sessionStorage.setItem(OB_SESSION_KEY, '1'); }catch(e){}
  const layer = document.getElementById('onboardLayer');
  layer.innerHTML = `
  <div class="ob-backdrop" id="obBackdrop" onclick="if(event.target===this) closeOnboarding()" role="dialog" aria-modal="true" aria-labelledby="obTitle">
    <div class="ob-card">
      <div class="ob-head">
        <div class="eyebrow">NE능률 디지털마케팅팀</div>
        <h2 id="obTitle">세미나 주제는<br>여러분의 요청에서 시작합니다</h2>
      </div>
      <div class="ob-body">
        <div class="ob-flow">
          <div class="st on"><span class="n">STEP 1</span><span class="t">요청서 작성</span></div>
          <span class="ar">›</span>
          <div class="st"><span class="n">STEP 2</span><span class="t">분기 검토</span></div>
          <span class="ar">›</span>
          <div class="st"><span class="n">STEP 3</span><span class="t">세미나 진행</span></div>
        </div>

        <ul class="ob-list">
          <li><span class="num">1</span><b>세미나는 3개월 치를 한 번에 기획합니다.</b> 매달 따로 정하지 않고, 분기별로 3건을 묶어 미리 준비합니다.</li>
          <li><span class="num">2</span><b>강사가 곧 우리 고객입니다.</b> 실제로 교재를 쓰고 계신 현직 선생님을 모시기 때문에, 섭외와 교안 준비에만 한 달 넘게 걸립니다.</li>
          <li><span class="num">3</span><b>그래서 미리 받습니다.</b> 세미나가 정해진 뒤에 의견을 주시면, 아무리 좋은 아이디어라도 반영할 시간이 남지 않습니다.</li>
        </ul>

        <div class="ob-point">
          지금 남겨주시는 한 줄이 <b>다음 분기 세미나의 출발점</b>이 됩니다.<br>
          다듬어서 쓰지 않으셔도 됩니다. <b>2~3분이면 충분합니다.</b>
        </div>
      </div>
      <div class="ob-foot">
        <label class="ob-check">
          <input type="checkbox" id="obHide"> 다음부터 이 안내를 보지 않기
        </label>
        <button type="button" class="ob-btn" onclick="closeOnboarding()">확인했습니다</button>
      </div>
    </div>
  </div>`;
  document.body.style.overflow = 'hidden';
  setTimeout(()=>{ const b = layer.querySelector('.ob-btn'); if(b) b.focus({preventScroll:true}); }, 380);
}

function closeOnboarding(){
  const layer = document.getElementById('onboardLayer');
  const back = document.getElementById('obBackdrop');
  const hide = document.getElementById('obHide');
  if(hide && hide.checked){ try{ localStorage.setItem(OB_HIDE_KEY, '1'); }catch(e){} }
  state.onboardOpen = false;
  if(!back){ layer.innerHTML = ''; document.body.style.overflow = ''; return; }
  back.classList.add('closing');
  setTimeout(()=>{ layer.innerHTML = ''; document.body.style.overflow = ''; }, 180);
}

function openSheetLayer(html){
  document.getElementById('sheetLayer').innerHTML = html;
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  document.getElementById('sheetLayer').innerHTML = '';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(state.onboardOpen){ closeOnboarding(); return; }
  if(document.getElementById('sheetLayer').innerHTML) closeSheet();
});

      ${helpBlock("ref")}
    </div>

    <div class="field">
      <label><span class="field-num">10</span>작성자 이메일<span class="opt">선택 · 알림용</span></label>
      <input type="email" placeholder="you@example.com" value="${escapeAttr(f.email)}" oninput="setFormField('email', this.value)">
      <div class="help">적어주시면 검토 결과가 정해질 때 메일로 알려드립니다. 안 적으셔도 <b>진행현황</b>에서 직접 확인하실 수 있습니다.</div>
    </div>

    <div class="submit-bar">
      <button class="submit-btn" onclick="submitForm()">${allDone ? "제출하기" : `제출하기 (${total-filled}개 항목이 남았습니다)`}</button>
    </div>
  `;
}

function setFormField(key, val){
  state.formData[key] = val;
  const f = state.formData;
  if(key === "qtrYear" || key === "qtrQuarter"){
    f.qtr = (f.qtrYear && f.qtrQuarter) ? `${f.qtrYear}년 ${f.qtrQuarter}` : "";
  }
  if(key === "deptChoice" && val !== DEPT_CUSTOM){ f.deptCustom = ""; }
  // 채워진 항목의 오류 표시는 즉시 해제
  REQUIRED_STEPS.forEach(st => { if(state.formErrors[st.key] && st.ok(f)) delete state.formErrors[st.key]; });
  draft.save(f);

  const rerenderKeys = ["qtrYear","qtrQuarter","deptChoice","productType","kind"];
  if(rerenderKeys.includes(key)){ render(); }
  else { updateProgressBar(); }
}

function updateProgressBar(){
  const f = state.formData;
  const filled = REQUIRED_STEPS.filter(st => st.ok(f)).length;
  const total = REQUIRED_STEPS.length;
  const allDone = filled === total;
  // 채워진 항목의 오류 표시를 화면에서도 즉시 지움
  REQUIRED_STEPS.forEach(st => {
    if(!st.ok(f)) return;
    const el = document.querySelector(`.field[data-field="${st.key}"]`);
    if(el && el.classList.contains("has-error")){
      el.classList.remove("has-error");
      const m = el.querySelector(".err-msg");
      if(m) m.remove();
    }
  });
  const fill = document.querySelector(".progress-fill");
  const cnt = document.querySelector(".progress-head .cnt");
  const btn = document.querySelector(".submit-btn");
  if(fill){ fill.style.width = Math.round(filled/total*100) + "%"; fill.classList.toggle("done", allDone); }
  if(cnt){ cnt.textContent = allDone ? "모두 작성 완료" : `${filled} / ${total}`; cnt.classList.toggle("done", allDone); }
  if(btn && !btn.disabled){ btn.textContent = allDone ? "제출하기" : `제출하기 (${total-filled}개 항목이 남았습니다)`; }
}

function toggleTargetTag(tag){
  const arr = state.formData.targetSelected;
  const idx = arr.indexOf(tag);
  if(idx === -1){ arr.push(tag); } else { arr.splice(idx,1); }
  if(state.formErrors.target && arr.length) delete state.formErrors.target;
  draft.save(state.formData);
  render();
}

function showSubmitError(reason){
  const wrap = document.getElementById('main');
  if(!wrap) return;
  const old = document.getElementById('submitError');
  if(old) old.remove();
  const div = document.createElement('div');
  div.id = 'submitError';
  div.className = 'notice err';
  div.innerHTML = '<span><b>제출하지 못했습니다.</b> ' + escapeHtml(reason) + '</span>';
  wrap.insertBefore(div, wrap.firstChild);
  div.scrollIntoView({behavior:'smooth', block:'center'});
}

async function submitForm(){
  const f = state.formData;
  const oldErr = document.getElementById('submitError');
  if(oldErr) oldErr.remove();
  const finalTarget = f.targetSelected.join('·');
  const finalDept = resolveDept(f);

  // 미입력 항목을 화면에서 바로 알려주고 첫 항목으로 이동
  const errs = {};
  REQUIRED_STEPS.forEach(st => { if(!st.ok(f)) errs[st.key] = st.msg; });
  if(Object.keys(errs).length){
    state.formErrors = errs;
    render();
    const first = document.querySelector('.field.has-error');
    if(first){
      first.scrollIntoView({behavior:'smooth', block:'center'});
      const input = first.querySelector('input, textarea');
      if(input) setTimeout(()=>input.focus({preventScroll:true}), 350);
    }
    return;
  }
  state.formErrors = {};

  const payload = {
    qtr:f.qtr, dept:finalDept, owner:f.owner,
    productType:f.productType, productName:f.productName, productDetail:f.productDetail, kind:f.kind,
    target:finalTarget, background:f.background, effect:f.effect,
    ref:f.ref, email:f.email
  };

  if(API_URL){
    const submitBtn = document.querySelector('.submit-btn');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '제출 중...'; }
    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'}, // preflight 방지용
        body: JSON.stringify(payload)
      });
      if(res.status === 404){
        showSubmitError('연결된 Apps Script 배포를 찾을 수 없습니다. 관리자에게 문의해주세요. 작성하신 내용은 그대로 보관됩니다.');
        if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '제출하기'; }
        return;
      }
      const text = await res.text();
      let data;
      try{
        data = JSON.parse(text);
      }catch(parseErr){
        showSubmitError('Apps Script 웹앱의 액세스 권한이 "모든 사용자"로 설정되어 있지 않습니다. 관리자에게 문의해주세요. 작성하신 내용은 그대로 보관됩니다.');
        if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '제출하기'; }
        return;
      }
      if(!data.ok){
        showSubmitError(data.error || '알 수 없는 오류');
        if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '제출하기'; }
        return;
      }
      state.needs.push({...payload, id:data.id, submitted:data.submitted, status:"접수완료", holdReason:""});
      draft.clear();
      state.draftRestored = false;
      state.lastSubmittedId = data.id;
      state.view = "confirm";
      render();
    }catch(e){
      showSubmitError('네트워크 연결을 확인하신 뒤 다시 시도해주세요. 작성하신 내용은 그대로 보관됩니다.');
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = '제출하기'; }
    }
    return;
  }

  // API 미설정 시 폴백: 로컬 저장(테스트용)
  const year = new Date().getFullYear();
  const seq = state.needs.length + 1;
  const id = `N-${year}-${String(seq).padStart(3,'0')}`;
  const now = new Date();
  const pad2 = x => String(x).padStart(2,'0');
  const submitted = `${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  const newNeed = {...payload, id, submitted, status:"접수완료", holdReason:""};
  state.needs.push(newNeed);
  persistNeeds();
  draft.clear();
  state.draftRestored = false;
  state.lastSubmittedId = id;
  state.view = "confirm";
  render();
}

/* =========================================================
   RENDER: CONFIRM
   ========================================================= */
function renderConfirm(){
  return `
    <div class="confirm-wrap">
      <div class="confirm-check">&#10003;</div>
      <h2>접수가 완료됐어요</h2>
      <div class="confirm-code mono">${state.lastSubmittedId}</div>
      <p>요청서가 정상적으로 접수되었습니다. 위 접수번호로 진행 상황을 조회하실 수 있습니다.<br><br>
      디지털마케팅팀이 분기 단위로 모아 검토하며, 결과가 확정되면 이메일을 남기신 경우 메일로 안내드립니다. 남기지 않으셨더라도 아래 <b>진행현황</b>에서 언제든 확인하실 수 있습니다.</p>
      <button class="confirm-btn" onclick="goToProgressAfterSubmit()">진행현황에서 확인하기 →</button>
    </div>
  `;
}
function goToProgressAfterSubmit(){
  state.view = "browse";
  state.tab = "progress";
  state.searchQuery = "";
  state.highlightId = state.lastSubmittedId;
  render();
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function onSearchInput(v){
  state.searchQuery = v;
  state.highlightId = '';
  state.page = 1;
  renderOnly();
}
function setSearchField(v){ state.searchField = v; state.highlightId=''; state.page=1; renderOnly(); }
function setStatusFilter(v){ state.filterStatus = v; state.highlightId=''; state.page=1; renderOnly(); }
function setQtrFilter(v){ state.filterQtr = v; state.highlightId=''; state.page=1; renderOnly(); }
function clearFilters(){
  state.searchQuery = '';
  state.searchField = 'all';
  state.filterStatus = 'all';
  state.filterQtr = 'all';
  state.highlightId = '';
  state.page = 1;
  renderOnly();
}
function hasActiveFilter(){
  return !!state.searchQuery || state.searchField !== 'all'
      || state.filterStatus !== 'all' || state.filterQtr !== 'all';
}

/* 검색 대상 정의 — 라벨과 실제 조회 필드를 한 곳에서 관리 */
const SEARCH_FIELDS = [
  {key:'all',     label:'전체 항목',        pick:n => [n.id,n.owner,n.dept,n.productName,n.productDetail,n.productType,n.kind,n.target,n.qtr,n.background,n.effect,n.status]},
  {key:'id',      label:'접수번호',          pick:n => [n.id]},
  {key:'owner',   label:'작성자',            pick:n => [n.owner]},
  {key:'dept',    label:'요청부서',          pick:n => [n.dept]},
  {key:'product', label:'제품·서비스',       pick:n => [n.productName, n.productDetail, n.productType]},
  {key:'kind',    label:'세미나종류',        pick:n => [n.kind]},
  {key:'target',  label:'목표고객',          pick:n => [n.target]},
  {key:'text',    label:'요청 사유·기대효과', pick:n => [n.background, n.effect]}
];
const STATUS_OPTIONS = ['접수완료','검토중','수락(채택)','차기 검토','완료'];

function matchesSearch(n, q, fieldKey){
  const def = SEARCH_FIELDS.find(f => f.key === fieldKey) || SEARCH_FIELDS[0];
  return def.pick(n).some(v => str(v).toLowerCase().includes(q));
}

/* 검색어와 일치하는 부분을 표시 (이스케이프 이후에 적용) */
function hl(value, q){
  const safe = escapeHtml(value);
  if(!q) return safe;
  const target = escapeHtml(q);
  if(!target) return safe;
  const esc = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try{
    return safe.replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
  }catch(e){ return safe; }
}
function renderOnly(){
  // 목록만 다시 그리되, 검색창의 입력 위치(커서)는 그대로 유지
  if(state.view === 'browse' && state.tab === 'progress'){
    const listWrap = document.getElementById('progressListWrap');
    if(listWrap){
      const before = document.getElementById('progressSearch');
      const pos = before ? before.selectionStart : null;
      const wasFocused = !!before && document.activeElement === before;
      listWrap.innerHTML = renderProgressList();
      requestAnimationFrame(syncHeaderHeight);
      if(wasFocused){
        const after = document.getElementById('progressSearch');
        if(after){
          after.focus({preventScroll:true});
          if(pos !== null){ try{ after.setSelectionRange(pos, pos); }catch(e){} }
        }
      }
      return;
    }
  }
  render();
}

/* 상단 메뉴 높이를 CSS 변수로 전달 — 표 머리글이 메뉴 바로 아래에 붙어 따라옵니다 */
function syncHeaderHeight(){
  const header = document.getElementById('header');
  if(header) document.documentElement.style.setProperty('--hdr-h', header.offsetHeight + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

function render(){
  const header = document.getElementById('header');
  const app = document.getElementById('app');
  const browseRow = document.getElementById('browseHeaderRow');
  const browseTabs = document.getElementById('browseTabs');
  const formRow = document.getElementById('formHeaderRow');
  const main = document.getElementById('main');

  const isWide = (state.view !== 'form' && state.view !== 'confirm');
  app.classList.toggle('wide-view', isWide);

  if(state.view === 'form'){
    browseRow.classList.add('hidden');
    browseTabs.classList.add('hidden');
    formRow.classList.remove('hidden');
    main.innerHTML = renderForm();
  } else if(state.view === 'confirm'){
    browseRow.classList.add('hidden');
    browseTabs.classList.add('hidden');
    formRow.classList.add('hidden');
    main.innerHTML = renderConfirm();
  } else {
    browseRow.classList.remove('hidden');
    browseTabs.classList.remove('hidden');
    formRow.classList.add('hidden');
    document.querySelectorAll('.tab-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab === state.tab);
    });
    if(state.tab === 'progress'){
      main.innerHTML = `<div id="progressListWrap">${renderProgressList()}</div>`;
    } else {
      main.innerHTML = renderArchiveList();
    }
  }
  requestAnimationFrame(syncHeaderHeight);
}

function escapeHtml(str){
  if(str === null || str === undefined || str === '') return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(str){
  if(str === null || str === undefined || str === '') return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* 시트 값이 숫자·날짜여도 문자열로 안전하게 다루기 위한 헬퍼 */
function str(v){ return (v === null || v === undefined) ? '' : String(v); }

/* 팝업이 렌더링될 레이어 */
['sheetLayer','onboardLayer'].forEach(id => {
  const el = document.createElement('div');
  el.id = id;
  document.body.appendChild(el);
});

/* init */
loadStoredNeeds();
openOnboarding(false);
</script>
